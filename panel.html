<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor ARIA - Panel</title>
  
  <!-- Tailwind CSS - Configuración estática minimalista vía CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración inline de Tailwind (permitido en Manifest V3 para configuración) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'aria-primary': '#4F46E5',
            'aria-success': '#10B981',
            'aria-warning': '#F59E0B',
            'aria-error': '#EF4444'
          }
        }
      }
    }
  </script>
  
  <style>
    /* Estilos adicionales mínimos */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <!-- Contenedor principal del panel -->
  <div class="max-w-6xl mx-auto">
    
    <!-- Header del panel -->
    <header class="bg-white shadow-sm rounded-lg p-4 mb-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Auditor ARIA</h1>
          <p class="text-sm text-gray-600 mt-1">Auditoría de accesibilidad WCAG</p>
        </div>
        
        <!-- Botón principal de auditoría -->
        <button 
          id="audit-btn" 
          class="bg-aria-primary hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          title="Auditar el elemento seleccionado en el inspector">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          Auditar componente seleccionado
        </button>
      </div>
    </header>
    
    <!-- Estado de carga -->
    <div id="loading-state" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4 hidden">
      <div class="flex items-center">
        <svg class="animate-spin h-5 w-5 text-aria-primary mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="loading-message" class="text-sm text-gray-700 font-medium">Inicializando...</span>
      </div>
    </div>
    
    <!-- Área de alertas/errores -->
    <div id="alert-container" class="mb-4 hidden">
      <div class="bg-red-50 border border-red-200 rounded-lg p-4">
        <div class="flex items-start">
          <svg class="h-5 w-5 text-red-600 mr-3 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <div class="flex-1">
            <h3 class="text-sm font-semibold text-red-800">Error</h3>
            <p id="alert-message" class="text-sm text-red-700 mt-1"></p>
          </div>
          <button id="alert-close" class="text-red-600 hover:text-red-800 ml-4">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Área de notificaciones de éxito -->
    <div id="success-container" class="mb-4 hidden">
      <div class="bg-green-50 border border-green-200 rounded-lg p-4">
        <div class="flex items-start">
          <svg class="h-5 w-5 text-green-600 mr-3 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <div class="flex-1">
            <p id="success-message" class="text-sm text-green-700 font-medium"></p>
          </div>
          <button id="success-close" class="text-green-600 hover:text-green-800 ml-4">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Sección de estadísticas -->
    <div class="grid grid-cols-3 gap-4 mb-4">
      <div class="bg-white rounded-lg p-4 shadow-sm">
        <div class="text-sm text-gray-600 font-medium">Total</div>
        <div id="stat-total" class="text-2xl font-bold text-gray-800 mt-1">0</div>
      </div>
      <div class="bg-white rounded-lg p-4 shadow-sm">
        <div class="text-sm text-gray-600 font-medium">Pendientes</div>
        <div id="stat-pending" class="text-2xl font-bold text-aria-warning mt-1">0</div>
      </div>
      <div class="bg-white rounded-lg p-4 shadow-sm">
        <div class="text-sm text-gray-600 font-medium">Resueltos</div>
        <div id="stat-resolved" class="text-2xl font-bold text-aria-success mt-1">0</div>
      </div>
    </div>
    
    <!-- Task List UI - Lista de tareas de accesibilidad -->
    <div class="bg-white shadow-sm rounded-lg p-4">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Lista de Tareas de Accesibilidad</h2>
      
      <!-- Estado vacío -->
      <div id="empty-state" class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <p class="text-gray-600 font-medium">No hay tareas de auditoría</p>
        <p class="text-sm text-gray-500 mt-2">Selecciona un elemento HTML y haz clic en "Auditar componente seleccionado"</p>
      </div>
      
      <!-- Contenedor de tareas -->
      <div id="tasks-container" class="space-y-3 hidden"></div>
    </div>
  </div>
  
  <!-- Script del controlador del panel (externo por CSP) -->
  <script src="panel.js"></script>
</body>
</html>
